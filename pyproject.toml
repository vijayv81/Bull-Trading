[project]
name = "trading-agent"
version = "0.1.0"
description = "Claude-agent-powered trading research and recommendation toolkit"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "alpaca-py>=0.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
