# Every value here is a deliberate default per plan §9 / §12 — tune to your own
# risk tolerance. Changes to this file should be committed with a message
# explaining why (plan §7 commit triggers).

position:
  # Hard cap, enforced in guardrails.position_size_reason() before any BUY is
  # submitted. Counts what you already hold in the same symbol, so repeated
  # partial buys can't stack past it one approval at a time.
  max_position_pct_of_portfolio: 5.0
  min_position_pct_of_portfolio: 1.0
  # Enforced in guardrails.position_count_reason(), checked before any BUY
  # that would open a symbol not already held — bounds aggregate exposure
  # across positions, since the 5% cap above only bounds any ONE of them.
  max_concurrent_positions: 10

  # Was declared but never enforced anywhere — now gates
  # recommendation_engine.score_candidate()'s stop-loss/take-profit bias
  # (below). true (default): a held position past either threshold biases
  # its action toward SELL, without overriding a strongly bullish technical
  # read outright. false: pure-technical action determination, unconditionally
  # — the one-line revert, no code change, same convention as auto_apply.enabled.
  mandatory_stop_loss: true
  # Read by position_sell_pressure() — a held position's unrealized return
  # this far below entry starts biasing its action toward SELL (cut losses).
  stop_loss_pct: 4.0
  # Same mechanism, opposite reason: this far above entry starts biasing
  # toward SELL too (lock in gains), not toward buying more.
  take_profit_pct: 8.0
  min_confidence_to_notify: 50 # below this, don't even surface a notification

  # When true (default), suggested_size_pct_of_portfolio scales linearly from
  # min_position_pct_of_portfolio at the notify threshold up to
  # max_position_pct_of_portfolio at confidence 100 — a just-over-threshold
  # call gets the floor, not the cap. false reverts to the original flat
  # behavior (always exactly the cap for any actionable rec), a one-line
  # revert with no code change. recommendation_engine.py:_suggested_size_pct().
  confidence_scaled_sizing: true

portfolio:
  starting_paper_capital_usd: 100000 # plan §12 open decision — set to your actual paper account size
  # Measured as Alpaca equity vs. prior close, so it resets each trading day.
  # Past this, guardrails.daily_loss_reason() halts the checkpoint routine before
  # it researches anything AND refuses any order submission for the rest of the day.
  max_daily_drawdown_pct: 2.0
  max_sector_concentration_pct: 25.0
  max_new_proposals_per_checkpoint: 5 # ranked by confidence, avoids notification fatigue

  # Hard ceiling on today's total submitted orders, every source combined
  # (human approvals AND auto_apply). Enforced in
  # guardrails.daily_trade_count_reason(), checked in
  # execute.order_manager.submit_approved_order() before every order — the
  # only sanctioned path to an Alpaca call, so this holds regardless of who
  # (or what) approved the trade. Distinct from
  # operational.auto_apply.max_trades_per_day below, which only paces
  # auto_apply's own trades and never sees a human's; this is the real
  # ceiling on the day's order count.
  max_daily_trades: 5

operational:
  # Kill switch: order_manager.submit_approved_order() checks this FIRST, before
  # anything else — for BOTH a human's approval and an auto_apply one. Flip to
  # false at any time to stop every order, auto or manual, immediately.
  trading_enabled: true

  # Must stay false. Alpaca client construction refuses outright if this is
  # true — flipping it is intentionally not enough on its own to reach a live
  # endpoint; see data/alpaca_client.py for the deliberate code-level guard.
  allow_live_trading: false

  # A recommendation with no approve/reject response within this window
  # expires rather than auto-executing or auto-rejecting (plan §8.6). Also the
  # expiry window for an auto_apply decision, for the same reason: a stale
  # decision shouldn't execute either way.
  approval_expiry_hours: 2

  # Opt-in extension, off by default in spirit — see CLAUDE.md's "Auto-apply"
  # section before turning this on. When enabled, run_checkpoint() writes its
  # own approve decision (tagged terms.source: "auto", never indistinguishable
  # from a human's) for the highest-confidence actionable recommendations and
  # submits them itself — no human clicks approve. `enabled: false` is the
  # single, one-line revert to the original "never executes without a human
  # approval record" behavior; every guardrail above (trading_enabled, the 5%
  # cap, no shorts, no options, daily-loss halt) still applies unchanged
  # either way, this only replaces the human decision step.
  auto_apply:
    enabled: true
    max_trades_per_day: 5 # across ALL checkpoints combined for the day, not per checkpoint

# Equities only — there is deliberately no `allow_options` key here. The ban is
# code-level (guardrails.is_option_symbol, enforced in both order_manager and
# alpaca_client.submit_market_order) precisely so it can't be undone by editing
# this file. Lifting it takes a reviewed code change.
